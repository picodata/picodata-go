services:
  picodata-1-1:
    image: docker.binary.picodata.io/picodata:26.1.6
    container_name: picodata-1-1
    hostname: picodata-1-1
    # The cluster is bootstrapped with two tiers so that the driver tests have
    # something to filter out.
    command:
      - run
      - -c
      - 'cluster.tier={"default":{"replication_factor":2,"bucket_count":3000,"can_vote":true},"arbiter":{"replication_factor":2,"bucket_count":3000,"can_vote":true}}'
    environment:
      PICODATA_PEER: picodata-1-1:3301
      PICODATA_LISTEN: picodata-1-1:3301
      PICODATA_INSTANCE_DIR: /pico/data/picodata-1-1
      PICODATA_INSTANCE_TIER: default
      PICODATA_ADVERTISE: picodata-1-1:3301
      PICODATA_FAILURE_DOMAIN: HOST=picodata-1
      PICODATA_INIT_REPLICATION_FACTOR: 2
      PICODATA_HTTP_LISTEN: picodata-1-1:8001
      PICODATA_PG_LISTEN: picodata-1-1:5432
      PICODATA_ADMIN_PASSWORD: T0psecret
      PICODATA_LOG_LEVEL: info
    volumes:
      - ../tmp:/pico
    ports:
      - "13301:3301"
      - "18301:8001"
      - "55432:5432"

  picodata-1-2:
    image: docker.binary.picodata.io/picodata:26.1.6
    container_name: picodata-1-2
    hostname: picodata-1-2
    command:
      - run
      - -c
      - 'cluster.tier={"default":{"replication_factor":2,"bucket_count":3000,"can_vote":true},"arbiter":{"replication_factor":2,"bucket_count":3000,"can_vote":true}}'
    environment:
      PICODATA_PEER: picodata-1-1:3301
      PICODATA_LISTEN: picodata-1-2:3301
      PICODATA_INSTANCE_DIR: /pico/data/picodata-1-2
      PICODATA_INSTANCE_TIER: arbiter
      PICODATA_ADVERTISE: picodata-1-2:3301
      PICODATA_FAILURE_DOMAIN: HOST=picodata-1
      PICODATA_INIT_REPLICATION_FACTOR: 2
      PICODATA_HTTP_LISTEN: picodata-1-2:8001
      PICODATA_PG_LISTEN: picodata-1-2:5432
      PICODATA_LOG_LEVEL: info
    volumes:
      - ../tmp:/pico
    ports:
      - "13302:3301"
      - "18302:8001"
      - "55433:5432"

  picodata-2-1:
    image: docker.binary.picodata.io/picodata:26.1.6
    container_name: picodata-2-1
    hostname: picodata-2-1
    command:
      - run
      - -c
      - 'cluster.tier={"default":{"replication_factor":2,"bucket_count":3000,"can_vote":true},"arbiter":{"replication_factor":2,"bucket_count":3000,"can_vote":true}}'
    environment:
      PICODATA_PEER: picodata-1-1:3301
      PICODATA_LISTEN: picodata-2-1:3301
      PICODATA_INSTANCE_DIR: /pico/data/picodata-2-1
      PICODATA_INSTANCE_TIER: default
      PICODATA_ADVERTISE: picodata-2-1:3301
      PICODATA_FAILURE_DOMAIN: HOST=picodata-2
      PICODATA_INIT_REPLICATION_FACTOR: 2
      PICODATA_HTTP_LISTEN: picodata-2-1:8001
      PICODATA_PG_LISTEN: picodata-2-1:5432
      PICODATA_LOG_LEVEL: info
    volumes:
      - ../tmp:/pico
    ports:
      - "13303:3301"
      - "18303:8001"
      - "55434:5432"

  picodata-2-2:
    image: docker.binary.picodata.io/picodata:26.1.6
    container_name: picodata-2-2
    hostname: picodata-2-2
    command:
      - run
      - -c
      - 'cluster.tier={"default":{"replication_factor":2,"bucket_count":3000,"can_vote":true},"arbiter":{"replication_factor":2,"bucket_count":3000,"can_vote":true}}'
    environment:
      PICODATA_PEER: picodata-1-1:3301
      PICODATA_LISTEN: picodata-2-2:3301
      PICODATA_INSTANCE_DIR: /pico/data/picodata-2-2
      PICODATA_INSTANCE_TIER: arbiter
      PICODATA_ADVERTISE: picodata-2-2:3301
      PICODATA_FAILURE_DOMAIN: HOST=picodata-2
      PICODATA_INIT_REPLICATION_FACTOR: 2
      PICODATA_HTTP_LISTEN: picodata-2-2:8001
      PICODATA_PG_LISTEN: picodata-2-2:5432
      PICODATA_LOG_LEVEL: info
    volumes:
      - ../tmp:/pico
    ports:
      - "13304:3301"
      - "18304:8001"
      - "55435:5432"

  # Runs the test suite inside the cluster network: instances advertise their
  # container addresses, and the driver connects to the addresses the topology
  # reports, not to the published ports.
  test-runner:
    image: docker-picodata.binary.picodata.io/picodata-go/go-runner:0.1.1
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    working_dir: /usr/src/app
    environment:
      PICODATA_TEST_CONN: "postgresql://admin:T0psecret@picodata-1-1:5432?sslmode=disable"
    volumes:
      - ..:/usr/src/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    profiles:
      - test

volumes:
  go-mod-cache:
  go-build-cache:
